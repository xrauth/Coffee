<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flashcards — Português / Inglês</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; }
  body {
    background:#f7f7f7;
    color:#292929;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    overflow-x:hidden;
  }
  .app {
    width:min(100%, 980px);
    min-height:100vh;
    margin:0 auto;
    padding:38px 34px 22px;
    display:flex;
    flex-direction:column;
  }
  .top {
    display:flex;
    align-items:center;
    justify-content:flex-end;
    height:82px;
  }
  .score {
    font-size:58px;
    line-height:1;
    font-weight:650;
    letter-spacing:-2px;
    min-width:130px;
    text-align:right;
  }
  .timer {
    height:12px;
    width:88%;
    margin:30px auto 68px;
    border-radius:20px;
    background:#dedede;
    overflow:hidden;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.04);
  }
  .timer-fill {
    width:0%;
    height:100%;
    background:#f14d32;
    border-radius:20px;
    transition:width .05s linear;
  }

  .card-wrap {
    position:relative;
    width:100%;
    min-height:630px;
    display:flex;
    justify-content:center;
    align-items:flex-start;
  }
  .card {
    width:min(700px, 82vw);
    min-height:625px;
    background:white;
    border-radius:42px;
    box-shadow:0 8px 28px rgba(0,0,0,.10);
    padding:108px 62px 48px;
    text-align:center;
    position:relative;
    overflow:hidden;
    transform:translateX(0);
    opacity:1;
    transition:transform .45s cubic-bezier(.2,.75,.25,1), opacity .35s ease;
  }
  .card.exit { transform:translateX(-90px); opacity:0; }
  .card.enter { transform:translateX(90px); opacity:0; }

  .word {
    min-height:128px;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom:5px;
  }
  .word .placeholder {
    font-size:58px;
    font-weight:700;
    letter-spacing:2px;
  }
  .translation {
    color:#777;
    font-size:32px;
    line-height:1.2;
    min-height:45px;
  }
  .divider {
    height:1px;
    background:#ededed;
    margin:42px 0 66px;
  }
  .sentence {
    min-height:66px;
    display:flex;
    justify-content:center;
    align-items:center;
  }
  .sentence .placeholder {
    font-size:27px;
    line-height:1.5;
    letter-spacing:1.5px;
    font-weight:500;
  }
  .sentence-translation {
    color:#8a8a8a;
    font-size:20px;
    line-height:1.35;
    margin-top:12px;
  }

  .placeholder {
    word-break:break-word;
  }
  .letter {
    display:inline-block;
    min-width:.58em;
    border-bottom:3px solid #2c2c2c;
    margin:0 .07em;
    line-height:1.12;
    height:1.15em;
  }
  .letter.space {
    border-bottom-color:transparent;
    min-width:.38em;
  }

  .keyboard {
    width:min(930px, 100%);
    margin:32px auto 0;
    padding-bottom:8px;
    user-select:none;
  }
  .row {
    display:flex;
    justify-content:center;
    gap:10px;
    margin:9px 0;
  }
  .key {
    border:0;
    background:transparent;
    color:#6f6f6f;
    width:70px;
    height:62px;
    font-size:38px;
    font-weight:400;
    border-bottom:2px solid #d7d7d7;
    cursor:pointer;
    touch-action:manipulation;
    transition:transform .08s ease, color .12s ease, border-color .12s ease;
  }
  .key:active { transform:translateY(2px); }
  .key.correct { color:#2f8f5b; border-color:#2f8f5b; }
  .key.wrong { color:#d94835; border-color:#d94835; }
  .key.backspace {
    width:92px;
    font-size:25px;
  }

  .status {
    position:absolute;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    color:#777;
    font-size:15px;
    opacity:0;
    transition:opacity .2s ease;
    pointer-events:none;
  }
  .status.show { opacity:1; }

  @media (max-width:720px) {
    .app { padding:22px 16px 14px; }
    .top { height:62px; }
    .score { font-size:42px; }
    .timer { width:86%; height:10px; margin:24px auto 42px; }
    .card-wrap { min-height:510px; }
    .card {
      width:calc(100vw - 44px);
      min-height:505px;
      border-radius:30px;
      padding:64px 26px 35px;
    }
    .word { min-height:86px; }
    .word .placeholder { font-size:40px; }
    .translation { font-size:25px; }
    .divider { margin:28px 0 42px; }
    .sentence .placeholder { font-size:19px; }
    .sentence-translation { font-size:16px; }
    .keyboard { margin-top:24px; }
    .row { gap:2px; margin:7px 0; }
    .key { width:9.4vw; height:54px; font-size:29px; }
    .key.backspace { width:12vw; font-size:20px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="score" id="score">0</div>
  </header>

  <div class="timer" aria-label="Tempo de 5 segundos">
    <div class="timer-fill" id="timerFill"></div>
  </div>

  <main class="card-wrap">
    <section class="card" id="card">
      <div class="word" id="word"></div>
      <div class="translation" id="translation"></div>

      <div class="divider"></div>

      <div class="sentence" id="sentence"></div>
      <div class="sentence-translation" id="sentenceTranslation"></div>

      <div class="status" id="status">Correto</div>
    </section>
  </main>

  <div class="keyboard" id="keyboard" aria-label="Teclado virtual">
    <div class="row">
      <button class="key" data-key="q">q</button><button class="key" data-key="w">w</button>
      <button class="key" data-key="e">e</button><button class="key" data-key="r">r</button>
      <button class="key" data-key="t">t</button><button class="key" data-key="y">y</button>
      <button class="key" data-key="u">u</button><button class="key" data-key="i">i</button>
      <button class="key" data-key="o">o</button><button class="key" data-key="p">p</button>
    </div>
    <div class="row">
      <button class="key" data-key="a">a</button><button class="key" data-key="s">s</button>
      <button class="key" data-key="d">d</button><button class="key" data-key="f">f</button>
      <button class="key" data-key="g">g</button><button class="key" data-key="h">h</button>
      <button class="key" data-key="j">j</button><button class="key" data-key="k">k</button>
      <button class="key" data-key="l">l</button>
    </div>
    <div class="row">
      <button class="key" data-key="z">z</button><button class="key" data-key="x">x</button>
      <button class="key" data-key="c">c</button><button class="key" data-key="v">v</button>
      <button class="key" data-key="b">b</button><button class="key" data-key="n">n</button>
      <button class="key" data-key="m">m</button>
      <button class="key backspace" data-key="backspace">⌫</button>
    </div>
  </div>
</div>

<script src="examples.js"></script>
<script>
(() => {
  const CARDS = window.FLASHCARDS || [];
  const TIMER_MS = 5000;
  const SCORE_MULTIPLIER = 1.37;

  const $ = id => document.getElementById(id);
  const wordEl = $("word");
  const translationEl = $("translation");
  const sentenceEl = $("sentence");
  const sentenceTranslationEl = $("sentenceTranslation");
  const timerFill = $("timerFill");
  const scoreEl = $("score");
  const cardEl = $("card");
  const statusEl = $("status");

  let current = null;
  let typed = "";
  let startedAt = 0;
  let timerFrame = null;
  let locked = false;
  let score = 0;
  let lastIndex = -1;

  function normalize(s) {
    return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  function randomCard() {
    if (CARDS.length === 0) return null;
    let i = Math.floor(Math.random() * CARDS.length);
    if (CARDS.length > 1) while (i === lastIndex) i = Math.floor(Math.random() * CARDS.length);
    lastIndex = i;
    return CARDS[i];
  }

  function makePlaceholder(text, typedText) {
    const normalized = normalize(text);
    const typedNormalized = normalize(typedText);
    let typedPos = 0;
    let html = "";

    for (let i = 0; i < normalized.length; i++) {
      const source = normalized[i];
      const original = text[i];

      if (source === " ") {
        html += '<span class="letter space">&nbsp;</span>';
      } else {
        const shown = typedNormalized[typedPos] === source ? original : "";
        html += '<span class="letter">' + (shown || "&nbsp;") + '</span>';
        if (shown) typedPos++;
      }
    }
    return html;
  }

  function render() {
    wordEl.innerHTML = '<div class="placeholder">' + makePlaceholder(current.word, typed) + '</div>';
    sentenceEl.innerHTML = '<div class="placeholder">' + makeSentencePlaceholder(current.sentence, typed) + '</div>';
    translationEl.textContent = current.translation;
    sentenceTranslationEl.textContent = current.sentenceTranslation;
  }

  function makeSentencePlaceholder(sentence, typedWord) {
    const nSentence = normalize(sentence);
    const nWord = normalize(current.word);
    let p = 0;
    let html = "";

    for (let i = 0; i < nSentence.length; i++) {
      const c = nSentence[i];
      if (c === " ") {
        html += '<span class="letter space">&nbsp;</span>';
        continue;
      }

      // Reveal only the letters of the target word, in the order typed.
      let reveal = false;
      if (p < nWord.length && c === nWord[p]) {
        // We only reveal a target-word letter when that character has been typed.
        reveal = p < normalize(typedWord).length;
      }

      const original = sentence[i];
      html += '<span class="letter">' + (reveal ? original : "&nbsp;") + '</span>';
      if (c === nWord[p] && p < nWord.length) p++;
    }
    return html;
  }

  // A more useful sentence rendering: every occurrence of the target word
  // reveals exactly as much of the typed target as has been entered.
  function renderSentence() {
    const sentence = current.sentence;
    const target = normalize(current.word);
    const entered = normalize(typed);
    const idx = normalize(sentence).indexOf(target);

    if (idx < 0) {
      sentenceEl.innerHTML = '<div class="placeholder">' + makePlaceholder(sentence, "") + '</div>';
      return;
    }

    let before = sentence.slice(0, idx);
    let hidden = sentence.slice(idx, idx + current.word.length);
    let after = sentence.slice(idx + current.word.length);

    const shownCount = Math.min(entered.length, target.length);
    let wordHtml = "";
    for (let i = 0; i < hidden.length; i++) {
      wordHtml += '<span class="letter">' + (i < shownCount ? hidden[i] : "&nbsp;") + '</span>';
    }

    sentenceEl.innerHTML =
      '<div class="placeholder">' +
      makePlaceholder(before, "") + wordHtml + makePlaceholder(after, "") +
      '</div>';
  }

  function renderAll() {
    wordEl.innerHTML = '<div class="placeholder">' + makePlaceholder(current.word, typed) + '</div>';
    renderSentence();
  }

  function updateTimer() {
    if (locked) return;
    const elapsed = performance.now() - startedAt;
    const pct = Math.min(100, elapsed / TIMER_MS * 100);
    timerFill.style.width = pct + "%";

    if (elapsed >= TIMER_MS) {
      locked = true;
      // The card remains playable after timeout, but earns zero bonus.
      cancelAnimationFrame(timerFrame);
      return;
    }
    timerFrame = requestAnimationFrame(updateTimer);
  }

  function startTimer() {
    cancelAnimationFrame(timerFrame);
    timerFill.style.width = "0%";
    startedAt = performance.now();
    locked = false;
    timerFrame = requestAnimationFrame(updateTimer);
  }

  function setScore(value) {
    score = value;
    scoreEl.textContent = Number.isInteger(score) ? score : score.toFixed(1);
  }

  function handleKey(key, button) {
    if (locked || !current) return;

    if (key === "backspace") {
      typed = typed.slice(0, -1);
      renderAll();
      return;
    }

    if (!/^[a-z]$/.test(key)) return;

    const target = normalize(current.word);
    const expected = target[normalize(typed).length];

    if (key !== expected) {
      if (button) {
        button.classList.add("wrong");
        setTimeout(() => button.classList.remove("wrong"), 180);
      }
      return;
    }

    typed += key;
    if (button) {
      button.classList.add("correct");
      setTimeout(() => button.classList.remove("correct"), 150);
    }
    renderAll();

    if (normalize(typed) === target) complete();
  }

  function complete() {
    locked = true;
    cancelAnimationFrame(timerFrame);

    const elapsed = Math.min(TIMER_MS, performance.now() - startedAt);
    const remaining = Math.max(0, TIMER_MS - elapsed) / 1000;
    const earned = remaining * SCORE_MULTIPLIER;
    setScore(score + earned);

    statusEl.classList.add("show");
    setTimeout(() => {
      statusEl.classList.remove("show");
      nextCard();
    }, 3000);
  }

  function nextCard() {
    cardEl.classList.add("exit");

    setTimeout(() => {
      current = randomCard();
      typed = "";
      renderAll();

      cardEl.classList.remove("exit");
      cardEl.classList.add("enter");

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          cardEl.classList.remove("enter");
          startTimer();
        });
      });
    }, 450);
  }

  document.querySelectorAll(".key").forEach(btn => {
    btn.addEventListener("click", () => handleKey(btn.dataset.key, btn));
  });

  // Physical keyboard is also supported.
  window.addEventListener("keydown", e => {
    const key = e.key.toLowerCase();
    if (key === "backspace") {
      e.preventDefault();
      handleKey("backspace");
    } else if (/^[a-z]$/.test(key)) {
      e.preventDefault();
      const btn = document.querySelector('[data-key="' + key + '"]');
      handleKey(key, btn);
    }
  });

  current = randomCard();
  renderAll();
  startTimer();
})();
</script>
</body>
</html>
